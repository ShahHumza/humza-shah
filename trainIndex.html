<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iron Lines — free train route board game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--panel:rgba(16,44,32,.78);--panel2:rgba(28,70,50,.9);--gold:#d4af50;--gold2:#f2dc94;--text:#f6efdc;--muted:#9db5a5;--line:rgba(212,175,80,.22);--bad:#e0605a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:radial-gradient(1200px 700px at 15% -10%,#1f5c40 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#173f2d,transparent 60%),#07170f;background-attachment:fixed}
h1,h2,h3{font-family:Cinzel,Georgia,serif;color:var(--gold2);margin:.2em 0;letter-spacing:.02em}
a{color:var(--gold2)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:11px;padding:.6em 1em;color:#24190a;
  background:linear-gradient(180deg,#f4d97e,#d1a93f 55%,#b88c2c);box-shadow:0 3px 0 #7a5a17,0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .08s,filter .15s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #7a5a17,0 3px 8px rgba(0,0,0,.35)}
button.ghost{background:rgba(255,255,255,.05);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--line)}
button.ghost:hover:not(:disabled){background:rgba(212,175,80,.12)}
button.sm{padding:.32em .7em;font-size:.84em;border-radius:9px}
button:disabled{opacity:.33;cursor:not-allowed;filter:grayscale(.6)}
button.on{box-shadow:0 0 0 2px #fff,0 0 18px rgba(242,220,148,.7)}
input,select{font:inherit;background:rgba(0,0,0,.28);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.55em .7em;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(6,20,13,.65);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.brand{font-family:Cinzel,serif;font-weight:800;font-size:1.35em;color:var(--gold2);text-decoration:none;letter-spacing:.06em}
.topr{display:flex;gap:14px;align-items:center}
.iconbtn{background:none;box-shadow:none;color:var(--gold2);font-size:1.25em;padding:.1em .3em}
.muted{color:var(--muted);font-size:.9em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 12px 32px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
.lbl{font-size:.72em;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.status{font-weight:700;color:var(--gold2);font-size:1.02em}
/* home */
.wrap{max-width:960px;margin:0 auto;padding:20px}
.hero{position:relative;text-align:center;padding:56px 10px 36px;overflow:hidden;border-radius:26px;margin-bottom:14px;
  background:radial-gradient(circle at 50% 40%,#2b86b5,#12547d 55%,#0a3150);box-shadow:inset 0 0 90px rgba(0,0,0,.5),0 20px 50px rgba(0,0,0,.4)}
.hero h1{font-size:clamp(44px,9vw,86px);margin:0;position:relative;text-shadow:0 6px 30px rgba(0,0,0,.6),0 0 40px rgba(212,175,80,.35)}
.hero p{position:relative;color:#e9f3ee;font-size:1.1em;margin:6px 0 0}
.fhex{position:absolute;width:70px;height:80px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);opacity:.32;animation:float 9s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0) rotate(0)}to{transform:translateY(-22px) rotate(12deg)}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.card h3{margin-top:0}
table.rules td{padding:5px 10px;border-bottom:1px solid var(--line);font-size:.92em}
/* game */
body.ingame{overflow:hidden}
#game{position:relative;height:calc(100dvh - 53px);padding:10px}
#boardarea{position:absolute;inset:10px;border-radius:24px;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#3197c7 0%,#1a6795 42%,#0c3657 100%);box-shadow:inset 0 0 100px rgba(0,0,0,.5),0 20px 50px rgba(0,0,0,.4)}
#boardarea::before{content:'';position:absolute;inset:-20%;pointer-events:none;
  background:repeating-radial-gradient(circle at 50% 45%,rgba(255,255,255,.045) 0 2px,transparent 3px 34px);animation:swell 7s ease-in-out infinite alternate}
@keyframes swell{from{transform:scale(1);opacity:.6}to{transform:scale(1.06);opacity:1}}
#boardarea{--sl:300px;--st:58px}
#boardarea svg{position:absolute;left:var(--sl);top:var(--st);width:calc(100% - 2*var(--sl));height:calc(100% - var(--st) - 8px)}
.hud{position:absolute;z-index:3}
.pill{background:rgba(8,28,20,.84);border:1px solid var(--line);border-radius:16px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.col{position:absolute;top:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:3;pointer-events:none;min-height:0}
.col>*{pointer-events:auto}
#colL{left:20px;align-items:flex-start;max-width:min(520px,calc(50% - 30px))}
#colR{right:20px;width:280px;align-items:stretch}
.colspacer{flex:1;pointer-events:none!important}
#statuspill{display:flex;align-items:center;gap:14px}
#plist{width:100%;flex:0 1 auto;max-height:52%;min-height:0;overflow-y:auto;padding:6px}
#bpanel{width:min(500px,100%)}#bpanel:empty{display:none}
#hud-top{top:20px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 620px));min-width:280px;display:flex;flex-direction:column;gap:8px;max-height:45%;overflow-y:auto}
.status-pill .status{font-size:.95em}
.prompt{border-color:var(--gold);color:var(--gold2);font-weight:700;text-align:center;animation:slidedown .3s ease}
.prompt div+div{margin-top:4px}
.offer{animation:slidedown .3s ease}
.offer.hot{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px rgba(0,0,0,.5)}
.offer .hand{margin:0;gap:6px}
.orow{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap;font-size:.9em}
.oname{font-weight:600;min-width:70px}
.ok{color:#8dffa6;font-weight:700}.no{color:#ff9d96}
.tradebox{animation:slideup .25s ease;background:rgba(10,32,23,.95)}
.piles{display:flex;gap:10px;align-items:stretch;margin:8px 0}
.pile{flex:1;min-height:70px;border:1.5px dashed rgba(242,220,148,.35);border-radius:12px;padding:6px 8px;background:rgba(0,0,0,.2)}
.pile .hand{margin-top:8px;gap:8px}
.plbl{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:800}
.ph{color:var(--muted);font-size:.8em;align-self:center}
.arrow{align-self:center;font-size:1.4em;color:var(--gold2)}
.reqrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req{font-size:1.25em;padding:.25em .55em}
@keyframes slideup{from{opacity:0;transform:translateY(16px)}}
@keyframes slidedown{from{opacity:0;transform:translateY(-12px)}}
.rollbtn{grid-column:1/-1;width:100%;padding:14px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.2em;animation:glow 1.4s ease-in-out infinite alternate}
.rollbtn span{font-size:1.5em;line-height:1}
@keyframes glow{from{box-shadow:0 3px 0 #7a5a17,0 0 0 rgba(242,220,148,0)}to{box-shadow:0 3px 0 #7a5a17,0 0 30px rgba(242,220,148,.75)}}
.fab{top:10px;right:10px;width:46px;height:46px;border-radius:50%;padding:0;display:none;place-items:center;font-size:1.3em}
.dotn{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;padding:0 4px}
.fab .dotn{position:absolute;top:-3px;right:-3px}
.winwrap{position:absolute;inset:0;display:grid;place-items:center;z-index:6;background:rgba(0,0,0,.35)}
/* dock */
.dockbox{background:rgba(8,28,20,.84);border:1px solid var(--line);border-radius:16px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 10px 26px rgba(0,0,0,.4)}
#handbar{max-width:100%}
#handbar .hand{margin:0;flex-wrap:nowrap;overflow-x:auto;padding:9px 9px 6px 2px}
.handmeta{font-size:.74em;margin-top:2px}
#actions{display:grid;grid-template-columns:repeat(6,62px);gap:6px;padding:7px}
.abtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:11px;line-height:1.1}
.abtn span{font-size:1.2em}.abtn small{font-size:.7em;font-weight:800}.abtn i{font-style:normal;font-size:.55em;letter-spacing:-1px;white-space:nowrap}
.abtn.end:not(:disabled){background:linear-gradient(180deg,#8be09a,#3aa35c);box-shadow:0 3px 0 #1d5e31,0 8px 18px rgba(0,0,0,.35)}
#bank{display:flex;flex-direction:row;align-items:center;gap:8px;width:250px;padding:7px 10px}
#bank .hand{gap:5px;margin:0;flex-wrap:nowrap}
#bank .rcard.mini{width:26px;height:36px;font-size:13px;border-radius:6px}#bank .rcard.mini .n{min-width:17px;height:17px;font-size:10px;top:-7px;right:-6px}#bank .plbl{font-size:.62em}
#mplayers{display:none}
.htotal{flex:none;width:58px;height:76px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:2px solid var(--gold);box-shadow:inset 0 0 14px rgba(212,175,80,.25);position:relative}
.htotal b{font-family:Cinzel,serif;font-size:1.9em;line-height:1;color:var(--gold2)}
.htotal span{font-size:.62em;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.htotal i{position:absolute;bottom:-9px;font-style:normal;font-size:9px;font-weight:800;background:var(--bad);color:#fff;padding:1px 5px;border-radius:6px;white-space:nowrap}
.htotal.danger{border-color:var(--bad);box-shadow:inset 0 0 14px rgba(224,96,90,.35),0 0 14px rgba(224,96,90,.4);animation:tpulse .8s ease-in-out infinite alternate}
.htotal.danger b{color:#ffb3ad}
#boardarea svg{cursor:grab;touch-action:none;overflow:visible}
body.panning,body.panning #boardarea svg{cursor:grabbing!important;user-select:none}
#mapctl{right:calc(var(--sl) + 4px);bottom:14px;display:flex;flex-direction:column;gap:6px}
#mapctl button{width:38px;height:38px;padding:0;font-size:1.1em;border-radius:11px;background:rgba(8,28,20,.84);backdrop-filter:blur(6px)}
/* side */
#tabs{flex:1;min-height:0;display:flex;flex-direction:column}
.tabbar{display:flex;gap:6px;margin-bottom:8px}.tabbar button{flex:1}
.tabbody{flex:1;min-height:0;overflow-y:auto;font-size:.84em}
.tabbody.log{color:var(--muted)}.tabbody.log div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}.tabbody.log div:first-child{color:var(--text)}
.tabbody.chat{display:flex;flex-direction:column;gap:3px;word-break:break-word}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
#sheet>.box{width:100%;max-height:85dvh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;background:rgba(12,36,26,.98)}
#tabs2{display:flex;flex-direction:column;min-height:240px;flex:1;margin-top:8px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;animation:fadein .2s}
.modalbox{max-width:420px;background:rgba(12,36,26,.98);padding:20px 22px}.modalbox p{color:var(--text);line-height:1.45}
@keyframes fadein{from{opacity:0}}
button.danger{background:linear-gradient(180deg,#f07a70,#c43b31);color:#fff;box-shadow:0 3px 0 #7d1d16,0 8px 18px rgba(0,0,0,.35)}
.badge.warn{background:rgba(224,96,90,.2);color:#ffc2bd}
.warnpill{border-color:var(--bad)!important;color:#ffd1cd!important}
/* players */
.pcard{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;padding:6px 8px;border-radius:13px;border:1px solid transparent;transition:background .3s}
.pcard.cur{background:linear-gradient(90deg,rgba(212,175,80,.2),rgba(212,175,80,.02));border-color:var(--line)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111;font-size:15px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.45);position:relative;flex:none}
.av.sm{width:30px;height:30px;font-size:12px}.av.xs{width:22px;height:22px;font-size:10px;display:inline-grid}
.cur .av::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--gold2);animation:spinpulse 1.6s ease-in-out infinite}
@keyframes spinpulse{50%{transform:scale(1.12);opacity:.4}}
.pn{font-weight:700;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:.74em;color:var(--muted);display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s}
.vpbig{font-family:Cinzel,serif;font-weight:800;font-size:1.4em;color:var(--gold2);text-align:right;line-height:1}
.vpbig small{display:block;font-family:Inter;font-size:.45em;color:var(--muted);font-weight:600;letter-spacing:.08em}
.pchip{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:20px;background:rgba(0,0,0,.25);border:1px solid transparent;flex:none}
.pchip.cur{border-color:var(--gold);background:rgba(212,175,80,.15)}
.pchip .pn{font-size:.78em;max-width:80px}.pchip .ps{font-size:.68em;gap:4px;margin:0}
.badge{display:inline-block;font-size:.7em;padding:1px 6px;border-radius:8px;background:rgba(212,175,80,.18);color:var(--gold2);margin-left:4px;font-weight:700}
/* cards */
.hand{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.rcard{position:relative;flex:none;width:54px;height:76px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 5px 12px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.28),inset 0 -14px 20px rgba(0,0,0,.18);transition:transform .15s;user-select:none}
.rcard.pick{cursor:pointer}
.rcard.pick:hover{transform:translateY(-5px) rotate(-2deg)}
.rcard .n{position:absolute;top:-8px;right:-8px;background:#fffaf0;color:#1a1206;font-weight:800;font-size:13px;border-radius:12px;min-width:23px;height:23px;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.rcard .lb{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#fff;margin-top:3px;font-weight:800;text-shadow:0 1px 2px #000a}
.rcard.zero{opacity:.35;filter:saturate(.3)}
.rcard.mini{width:36px;height:50px;font-size:18px;border-radius:8px}
.rcard.mini .n{min-width:19px;height:19px;font-size:11px;top:-7px;right:-7px}
.rcard.bump{animation:bump .55s}
@keyframes bump{35%{transform:scale(1.18) translateY(-8px)}}
.plus{position:absolute;top:-10px;left:50%;color:#8dffa6;font-weight:800;font-size:17px;animation:floatup 1.3s ease-out forwards;text-shadow:0 1px 4px #000;pointer-events:none}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}
.rcard.dev{background:linear-gradient(160deg,#5b45a0,#241848);font-size:23px}
.rcard.dev.playable{box-shadow:0 0 0 2px var(--gold2),0 0 16px rgba(242,220,148,.6),0 5px 12px rgba(0,0,0,.45)}
.playtag{position:absolute;bottom:-8px;background:var(--gold2);color:#241848;font-size:9px;font-weight:800;padding:1px 6px;border-radius:6px;letter-spacing:.06em}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:9px;padding:2px 8px;font-size:.85em;color:var(--gold2);white-space:nowrap}
.timer.low{color:#ffb3ad;border-color:var(--bad);animation:tpulse .5s ease-in-out infinite alternate}
.big{width:100%;font-size:1.08em;padding:.75em}
.dicewrap{display:flex;gap:8px;align-items:center}
.die{width:38px;height:38px;border-radius:10px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;
  background:linear-gradient(145deg,#fff9e6,#e3d5ae);box-shadow:0 3px 0 #a8976a,0 8px 14px rgba(0,0,0,.45),inset 0 1px 0 #fff}
.die.r{background:linear-gradient(145deg,#ee5b4d,#a71d14);box-shadow:0 3px 0 #6e130d,0 8px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.die i{width:7px;height:7px;border-radius:50%;background:#2a1f10;place-self:center;opacity:0}
.die.r i{background:#fff6e0}
.die i.on{opacity:1}
.die.rolling{animation:tumble .75s cubic-bezier(.3,1.4,.5,1)}
.die.r.rolling{animation-delay:.06s}
@keyframes tumble{0%{transform:translate(-30px,-26px) rotate(-260deg) scale(.6)}55%{transform:translate(4px,3px) rotate(18deg) scale(1.08)}75%{transform:translate(-2px,-3px) rotate(-6deg)}100%{transform:none}}
.sum{font-family:Cinzel;font-weight:800;font-size:1.5em;color:var(--gold2);min-width:28px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:700;color:var(--gold2)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2a1614;border:1px solid var(--bad);color:#ffd9d6;padding:10px 18px;border-radius:12px;display:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:45}
#banner div{font-family:Cinzel,serif;font-weight:800;font-size:clamp(32px,7vw,78px);color:var(--gold2);text-shadow:0 4px 30px rgba(0,0,0,.85),0 0 50px rgba(212,175,80,.6);animation:ban 1.7s ease forwards;text-align:center;padding:0 10px}
@keyframes ban{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.06)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:44}
.winbox{text-align:center;padding:22px 28px}
.winbox h2{font-size:2em}
/* responsive */
@media(max-width:1250px) and (min-width:901px){#boardarea{--sl:255px}#colR{width:230px}#actions{grid-template-columns:repeat(6,54px)}#bank{width:220px}#bank .rcard.mini{width:22px;height:32px;font-size:11px}#hud-top{width:min(400px,calc(100% - 540px))}.rcard{width:46px;height:64px;font-size:21px}.rcard .lb{font-size:8px}}
@media(max-height:760px) and (min-width:901px){.rcard{width:44px;height:62px;font-size:20px}.rcard .lb{font-size:8px}.pcard{padding:3px 6px}.av{width:30px;height:30px;font-size:12px}.pcard{grid-template-columns:30px 1fr auto}.abtn{padding:3px 2px}.pile{min-height:56px}}
@media(max-width:900px){
  #game{display:flex;flex-direction:column;gap:6px;padding:6px}
  #boardarea{position:relative;inset:auto;flex:1;min-height:0;order:1;--sl:0px;--st:52px}
  .col{display:contents}
  #statuspill{position:absolute;top:14px;left:14px;right:70px;z-index:4;padding:6px 10px;gap:8px;justify-content:space-between}
  #plist,#tabs,#bank,.colspacer{display:none}
  .fab{display:grid}
  #mplayers{display:flex;gap:6px;overflow-x:auto;width:100%;padding:2px;order:2}
  #bpanel{order:3;width:100%}
  #handbar{order:4;width:100%;padding:6px 8px}
  #actions{order:5;width:100%;grid-template-columns:repeat(6,1fr);padding:6px}
  #actions .rollbtn{grid-column:1/-1}
  #hud-top{top:66px;width:calc(100% - 20px);min-width:0}
  .rcard{width:46px;height:64px;font-size:21px}.rcard .lb{font-size:8px}.htotal{width:48px;height:64px}.htotal b{font-size:1.5em}
  .tradebox{padding:8px 10px}.pile{min-height:56px}.pile .hand{margin-top:4px}.rcard.mini{width:30px;height:42px;font-size:15px}.tradebox .muted[style]{display:none}

<script>
// ================= ENGINE =================
const COLORS=['red','orange','yellow','green','blue','purple','black','white'];

const PCOL=['#e0453b','#3b74e0','#f2c230','#3aa35c','#a15be0'];
const PCNAME=['Red','Blue','Yellow','Green','Purple'];
const PTS={1:1,2:2,3:4,4:7,5:10,6:15};
const TRAINS=45,LONGEST=10;
const CITIES=[
 ['Seattle',75,55,'t'],['Portland',60,118,'l'],['Boise',205,160,'dl'],['Helena',335,105,'t'],['Salt Lake City',265,265,'dr'],
 ['San Francisco',62,322,'dr'],['Las Vegas',190,385,'r'],['Los Angeles',122,440,'l'],['San Diego',160,490,'b'],['Phoenix',258,468,'b'],
 ['Denver',405,295,'dl'],['Santa Fe',392,420,'l'],['El Paso',390,522,'b'],['Omaha',560,245,'t'],['Kansas City',585,318,'ur'],
 ['Oklahoma City',532,420,'dl'],['Dallas',555,497,'l'],['Houston',602,560,'b'],['Little Rock',650,445,'r'],['New Orleans',692,556,'b'],
 ['Minneapolis',600,142,'l'],['Duluth',640,72,'ur'],['Chicago',705,212,'t'],['St. Louis',670,322,'r'],['Nashville',752,395,'t'],

].map(([name,x,y,lab],id)=>({id,name,x,y,lab}));
const CI=Object.fromEntries(CITIES.map(c=>[c.name,c.id]));
const ROUTE_DEF=[
 ['Seattle','Portland',1,'gray','gray'],['Seattle','Boise',4,'yellow'],['Seattle','Helena',6,'purple'],['Portland','Boise',3,'red'],
 ['Portland','San Francisco',5,'green','purple'],['Boise','Helena',2,'gray'],['Boise','Salt Lake City',2,'blue'],
 ['San Francisco','Salt Lake City',5,'white','orange'],['San Francisco','Los Angeles',3,'purple','yellow'],['Los Angeles','San Diego',1,'gray'],
 ['Los Angeles','Las Vegas',2,'gray'],['Los Angeles','Phoenix',3,'gray'],['San Diego','Phoenix',3,'blue'],['San Diego','El Paso',6,'black'],
 ['Las Vegas','Salt Lake City',3,'orange'],['Las Vegas','Phoenix',2,'gray'],['Helena','Salt Lake City',3,'purple'],['Helena','Denver',4,'green'],
 ['Helena','Duluth',6,'orange'],['Helena','Omaha',5,'red'],['Salt Lake City','Denver',3,'red','yellow'],['Phoenix','Santa Fe',3,'white'],
 ['Phoenix','El Paso',3,'gray'],['Denver','Santa Fe',2,'gray'],['Denver','Kansas City',4,'black','orange'],['Denver','Omaha',4,'purple'],
 ['Denver','Oklahoma City',4,'red'],['Santa Fe','El Paso',2,'gray'],['Santa Fe','Oklahoma City',3,'blue'],['El Paso','Dallas',4,'red'],
 ['El Paso','Houston',6,'green'],['Oklahoma City','Dallas',2,'gray','gray'],['Oklahoma City','Kansas City',2,'gray','gray'],
 ['Oklahoma City','Little Rock',2,'gray'],['Dallas','Little Rock',2,'gray'],['Dallas','Houston',1,'gray','gray'],['Houston','New Orleans',2,'gray'],
 ['Little Rock','St. Louis',2,'gray'],['Little Rock','Nashville',3,'white'],['Little Rock','New Orleans',3,'green'],['Kansas City','Omaha',1,'gray','gray'],
 ['Kansas City','St. Louis',2,'blue','purple'],['Omaha','Minneapolis',2,'gray','gray'],['Omaha','Chicago',4,'blue'],['Minneapolis','Duluth',1,'gray','gray'],
 ['Minneapolis','Chicago',3,'black'],['Duluth','Chicago',3,'red'],['Duluth','Detroit',4,'white'],['Chicago','St. Louis',2,'green','white'],
 ['Chicago','Detroit',2,'yellow'],['Chicago','Pittsburgh',3,'orange','black'],['Detroit','Pittsburgh',2,'gray'],['Detroit','New York',4,'blue'],
 ['St. Louis','Nashville',2,'gray'],['St. Louis','Pittsburgh',5,'green'],['Nashville','Atlanta',1,'gray'],['Nashville','Pittsburgh',4,'yellow'],
 ['Nashville','Charlotte',3,'black'],['Atlanta','Charlotte',2,'gray','gray'],['Atlanta','New Orleans',4,'yellow','orange'],['Atlanta','Miami',5,'blue'],
 ['New Orleans','Miami',6,'red'],['Charlotte','Washington',2,'gray','gray'],['Charlotte','Miami',4,'purple'],['Washington','Pittsburgh',2,'gray'],
 ['Washington','New York',2,'orange','black'],['Pittsburgh','New York',2,'white','green'],['New York','Boston',2,'yellow','red']
];
const ROUTES=[];
ROUTE_DEF.forEach(([a,b,len,c1,c2])=>{const A=CI[a],B=CI[b];if(A==null||B==null)throw Error('bad city '+a+b);
  const r1={id:ROUTES.length,a:A,b:B,len,color:c1,twin:null,side:c2?-1:0};ROUTES.push(r1);
  if(c2){const r2={id:ROUTES.length,a:A,b:B,len,color:c2,twin:r1.id,side:1};r1.twin=r2.id;ROUTES.push(r2)}});
const ADJ=CITIES.map(()=>[]);ROUTES.forEach(r=>{ADJ[r.a].push(r.id);ADJ[r.b].push(r.id)});
const TICKET_DEF=[['Los Angeles','New York'],['Seattle','New York'],['Seattle','Los Angeles'],['San Francisco','Atlanta'],['Portland','Nashville'],['Boston','Miami'],
 ['Denver','Pittsburgh'],['Chicago','New Orleans'],['Dallas','New York'],['Helena','Los Angeles'],['Duluth','Houston'],['Kansas City','Houston'],['Denver','El Paso'],
 ['Phoenix','Chicago'],['Salt Lake City','Kansas City'],['Minneapolis','Houston'],['Omaha','Atlanta'],['Las Vegas','Dallas'],['San Diego','Denver'],['Boise','Chicago'],
 ['Little Rock','Boston'],['Detroit','Miami'],['St. Louis','Washington'],['Santa Fe','Nashville'],['Oklahoma City','Charlotte'],['Seattle','Duluth'],['Portland','Phoenix'],
 ['Boston','Chicago'],['New Orleans','Washington'],['Helena','Kansas City'],['San Francisco','Denver'],['Los Angeles','Miami'],['Houston','Pittsburgh'],['El Paso','Atlanta'],
 ['Seattle','Miami'],['Duluth','El Paso']].filter(t=>CI[t[0]]!=null&&CI[t[1]]!=null);
function shortest(from,to,cost){ // dijkstra over routes; cost(r) -> number|Infinity
  const d=CITIES.map(()=>Infinity),prev=CITIES.map(()=>null),done=new Set();d[from]=0;
  while(true){let u=-1,best=Infinity;for(let i=0;i<d.length;i++)if(!done.has(i)&&d[i]<best){best=d[i];u=i}
    if(u<0||u===to)break;done.add(u);
    for(const rid of ADJ[u]){const r=ROUTES[rid],c=cost(r);if(c===Infinity)continue;const w=r.a===u?r.b:r.a;if(d[u]+c<d[w]){d[w]=d[u]+c;prev[w]=rid}}}
  if(d[to]===Infinity)return null;const path=[];let x=to;while(x!==from){const rid=prev[x];path.push(rid);const r=ROUTES[rid];x=r.a===x?r.b:r.a}
  return{cost:d[to],path};
}
const TICKETS=TICKET_DEF.map(([a,b],id)=>{const A=CI[a],B=CI[b];const sp=shortest(A,B,r=>r.len);return{id,a:A,b:B,pts:sp.cost+(sp.cost>=16?2:0)}});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

const handSize=h=>Object.values(h).reduce((a,b)=>a+b,0);
const tName=t=>`${CITIES[TICKETS[t].a].name} → ${CITIES[TICKETS[t].b].name}`;

function newGame(cfg,opts={}){
  const deck=shuffle([...COLORS.flatMap(c=>Array(12).fill(c)),...Array(14).fill('loco')]);
  const tdeck=shuffle(TICKETS.map(t=>t.id));
  const players=cfg.map((c,i)=>{const hand=emptyHand();for(let k=0;k<4;k++)hand[deck.pop()]++;
    return{name:c.name,bot:!!c.bot,color:PCOL[i],hand,tickets:[],pending:[tdeck.pop(),tdeck.pop(),tdeck.pop()],trains:TRAINS,score:0}});

function drawCard(s){if(!s.deck.length&&s.discard.length){s.deck=shuffle(s.discard);s.discard=[]}return s.deck.length?s.deck.pop():null}
function refillMarket(s){
  for(let guard=0;guard<6;guard++){
    for(let i=0;i<5;i++)if(!s.market[i]){const c=drawCard(s);s.market[i]=c||null}
    const locos=s.market.filter(c=>c==='loco').length,avail=s.deck.length+s.discard.length;

    break;
  }

  if(s.routes[r.id]!=null)return 'Route already claimed';
  if(r.twin!=null){const o=s.routes[r.twin];if(o!=null){if(o===p)return "You can't claim both sides of a double route";if(s.players.length<=3)return 'In 2–3 player games only one side of a double route can be used'}}

}
function payOptions(s,p,rid){ // returns [{color,use:{c:n,loco:n}}]
  const r=ROUTES[rid],P=s.players[p],L=r.len,H=P.hand,out=[];

    else if(l.startsWith('🎫'))S.push('ticket');
    else if(l.startsWith('🃏')||l.startsWith('🌈'))S.push('draw');
    if((l.startsWith('— '))&&G.phase!=='over'&&!G.players[G.turn].bot){
      const humans=G.players.filter(p=>!p.bot).length;
      if(mode!=='local'&&G.turn===me){S.push('turn');setTimeout(()=>banner('Your turn'),350)}
      else if(mode==='local'){S.push('turn');setTimeout(()=>banner(humans>1?`${G.players[G.turn].name}'s turn`:'Your turn'),350)}
    }
  }
  [...new Set(S)].forEach((s,i)=>setTimeout(()=>play(s),i*160));

function confetti(){
  const cv=$('confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#f2dc94','#d4af50','#e0453b','#3b74e0','#3aa35c','#fff','#f2c230'];
  const ps=Array.from({length:220},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6+3,c:cols[rnd(cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
    if(t-t0<4500)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height)})(t0);
}
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  for(let k=a.attributes.length-1;k>=0;k--){const n=a.attributes[k].name;if(!b.hasAttribute(n))a.removeAttribute(n)}
  for(const at of b.attributes)if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let k=0;k<bc.length;k++){if(k<ac.length)morph(ac[k],bc[k]);else a.appendChild(bc[k])}
  for(let k=bc.length;k<ac.length;k++)ac[k].remove();
}

function hostMsg(c,d){

    }

let cam={x:0,y:0,z:1},drag=null,dragged=false;
function camTransform(){const{cx,cy}=boardVB;return `translate(${cam.x.toFixed(1)} ${cam.y.toFixed(1)}) translate(${cx} ${cy}) scale(${cam.z.toFixed(3)}) translate(${-cx} ${-cy})`}
function clampCam(){cam.z=Math.min(2.4,Math.max(.8,cam.z));const mx=boardVB.w*(.15+.45*(cam.z-1)),my=boardVB.h*(.15+.45*(cam.z-1));cam.x=Math.max(-mx,Math.min(mx,cam.x));cam.y=Math.max(-my,Math.min(my,cam.y))}
function applyCam(){clampCam();const g=$('cam');if(g)g.setAttribute('transform',camTransform());const r=$('recenter');if(r)r.disabled=!cam.x&&!cam.y&&cam.z===1}
function zoomBy(f){cam.z*=f;applyCam()}
function recenter(){cam={x:0,y:0,z:1};applyCam()}
function unitsPerPx(svg){const r=svg.getBoundingClientRect();return Math.max(boardVB.w/r.width,boardVB.h/r.height)}
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)<6)return;
  drag.moved=true;document.body.classList.add('panning');cam.x=drag.x+dx*drag.u;cam.y=drag.y+dy*drag.u;applyCam()});
window.addEventListener('pointerup',()=>{if(!drag)return;if(drag.moved){dragged=true;setTimeout(()=>dragged=false,60)}drag=null;document.body.classList.remove('panning')});
function bindBoard(){

function routeClick(rid){

function gameHTML(v){
  const s=G,unread=(s.chat||[]).length-chatSeenTab;
  return `<div id="game">
   <div id="mainc">
    <div id="boardarea">${mapSVG(s,v)}
      <div class="hud" id="hud-tl">${statusHUD(s,v)}</div>
      <button class="hud fab" id="chatfab" onclick="uiSheet=!uiSheet;render()">💬${unread>0&&uiTab!=='chat'?`<span class="dotn">${unread}</span>`:''}</button>
      <div class="hud" id="mapctl"><button class="ghost" title="Zoom in" onclick="zoomBy(1.15)">＋</button><button class="ghost" title="Zoom out" onclick="zoomBy(1/1.15)">－</button><button class="ghost" id="recenter" title="Re-center (or double-click)" ${!cam.x&&!cam.y&&cam.z===1?'disabled':''} onclick="recenter()">⟲</button></div>
      <div class="hud" id="hud-top">${mode==='client'&&reconnecting?'<div class="pill prompt warnpill">📡 Reconnecting to the host…</div>':''}${promptHTML(s,v)}</div>
      <div class="hud" id="hud-bl">${bottomPanelHTML(s,v)}</div>
      ${finalHTML(s)}
    </div>
    <div id="dock"><div id="mplayers">${playersHTML(s,v,true)}</div>${handHTML(s,v)}</div>
   </div>
   <div id="colR"><div class="pill" id="plist">${playersHTML(s,v,false)}</div>${marketHTML(s,v)}<div class="pill" id="tabs">${uiSheet?'':tabsHTML(s,v)}</div></div>
   ${uiSheet?`<div id="sheet" onclick="if(event.target===this){uiSheet=false;render()}"><div class="box"><div class="row" style="justify-content:space-between"><b>Players</b><button class="sm ghost" onclick="uiSheet=false;render()">✕</button></div>${playersHTML(s,v,false)}<div id="tabs2">${tabsHTML(s,v)}</div></div></div>`:''}
  </div>`;
}
(function boot(){
  const code=(new URLSearchParams(location.search).get('room')||'').toUpperCase(),sv=loadSave();
  if(code&&sv&&sv.code===code)return resumeHost(sv);
  if(code&&localStorage.getItem('il_joined')===code&&myName)return joinRoom(code,true);
  showHome();
})();
</script>
